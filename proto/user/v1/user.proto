syntax = "proto3";

package user.v1;

option go_package = "github.com/oulabla/go-base/gen/user/v1;userv1";

// ────────────────────────────────────────────────
// Импортируем аннотации для HTTP-маппинга (grpc-gateway)
// ────────────────────────────────────────────────
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// ────────────────────────────────────────────────
// Сервис UserService
// ────────────────────────────────────────────────
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
}

// ────────────────────────────────────────────────
// Сообщения
// ────────────────────────────────────────────────

// Запрос на получение пользователя
message GetUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Ответ на получение пользователя
message GetUserResponse {
  string id   = 1;
  string name = 2;
}

// Запрос на создание пользователя
message CreateUserRequest {
  string name  = 1 [(google.api.field_behavior) = REQUIRED];
  // string email = 2;   // можно добавить позже
}

// Ответ на создание пользователя
message CreateUserResponse {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}